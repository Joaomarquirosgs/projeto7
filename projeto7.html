<!DOCTYPE html>
<head>
    <title>Cadastro de Usuário</title>
</head>
<body>

    <header>
        <nav>
            <a href="#">Início</a> | 
            <a href="#">Cadastro</a>
        </nav>
        <h1>Formulário de Cadastro de Usuário</h1>
    </header>

    <section>
        <form action="#" method="post">
            <label for="nome">Nome Completo:</label><br>
            <input type="text" id="nome" name="nome" required><br><br>

            <label for="email">E-mail:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="senha">Senha:</label><br>
            <input type="password" id="senha" name="senha" required><br><br>

            <label for="genero">Gênero:</label><br>
            <select id="genero" name="genero">
                <option value="">Selecione...</option>
                <option value="feminino">Feminino</option>
                <option value="masculino">Masculino</option>
                <option value="outro">Outro</option>
                <option value="nao-informar">Prefiro não informar</option>
            </select><br><br>

            <label>Interesses:</label><br>
            <input type="checkbox" id="tecnologia" name="interesses" value="tecnologia">
            <label for="tecnologia">Tecnologia</label><br>
            
            <input type="checkbox" id="esportes" name="interesses" value="esportes">
            <label for="esportes">Esportes</label><br>
            
            <input type="checkbox" id="musica" name="interesses" value="musica">
            <label for="musica">Música</label><br>
            
            <input type="checkbox" id="leitura" name="interesses" value="leitura">
            <label for="leitura">Leitura</label><br><br>

            <label for="biografia">Breve Biografia:</label><br>
            <textarea id="biografia" name="biografia" rows="5" cols="40" placeholder="Fale um pouco sobre você..."></textarea><br><br>

            <input type="submit" value="Cadastrar">
        </form>
    </section>

</body>
</html>
